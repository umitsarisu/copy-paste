<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Spare Parts Costs</title>
</head>

<body>
    <div id="sparePartsModule" class="container-fluid py-2 px-3 px-sm-3"
        style="background-color: #f4f1ea; min-height: 100vh;">
        <!-- SEKMELER (TABS - Mobilde kaydırılabilir esnek yapı) -->
        <ul class="nav nav-tabs mb-3 border-bottom border-secondary flex-nowrap overflow-x-auto"
            style="white-space: nowrap;">
            <li class="nav-item">
                <button class="nav-link active fw-bold text-dark px-3 py-2 fs-6" id="tabSelectBtn"
                    onclick="switchSpareTab('select')">
                    📋 Parça Seçimi & Hesaplama
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold text-secondary px-3 py-2 fs-6" id="tabAdminBtn"
                    onclick="switchSpareTab('admin')">
                    🔒 Parça Yönetimi
                </button>
            </li>
        </ul>

        <!-- ======================================================= -->
        <!-- SEKME 1: YEDEK PARÇA SEÇİMİ VE HESAPLAMA EKRANI         -->
        <!-- ======================================================= -->
        <div id="tabSelectView">
            <div class="row g-3">

                <!-- SOL / ÜST: Parça Listesi & Arama Kutusu -->
                <div class="col-12 col-lg-7">
                    <div class="card shadow-sm border-0" style="background-color: #ffffff;">
                        <div
                            class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center py-2">
                            <span class="fs-6">Yedek Parçalar</span>
                            <button class="btn btn-sm btn-outline-light" onclick="loadParts(true)">🔄 Yenile</button>
                        </div>
                        <div class="card-body p-2 p-sm-3">
                            <!-- Arama Kutusu -->
                            <div class="input-group mb-2">
                                <span class="input-group-text bg-light">🔍</span>
                                <input type="text" id="searchPartInput" class="form-control form-control-lg fs-6"
                                    autocomplete="off" spellcheck="false" placeholder="Parça no veya adı ile ara..."
                                    oninput="onSearchInput()">
                            </div>

                            <!-- Parça Tablosu -->
                            <div class="table-responsive"
                                style="max-height: 380px; overflow-y: auto; -webkit-overflow-scrolling: touch;">
                                <table class="table table-hover align-middle border mb-0" style="width: 100%;">
                                    <thead class="table-light sticky-top">
                                        <tr>
                                            <th style="width: 35%;">Parça No</th>
                                            <th style="width: 40%;">Parça Adı</th>
                                            <th style="width: 25%;" class="text-end">İşlem</th>
                                        </tr>
                                    </thead>
                                    <tbody id="partsSelectTableBody">
                                        <tr>
                                            <td colspan="3" class="text-center text-muted py-3">Yükleniyor...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SAĞ / ALT: Seçilen Parçalar & Toplam Maliyet Hesabı -->
                <div class="col-12 col-lg-5">
                    <div class="card shadow-sm border-0" style="background-color: #e9e4d9;">
                        <div class="card-header bg-secondary text-white fw-bold py-2 fs-6">
                            🛒 Seçilen Parçalar <span id="selectedBadge" class="badge bg-dark ms-1">0</span>
                        </div>
                        <div class="card-body p-2 p-sm-3">
                            <div class="table-responsive bg-white rounded border mb-3"
                                style="max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch;">
                                <table class="table table-sm align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Parça No</th>
                                            <th>Parça Adı</th>
                                            <th class="text-end">Çıkar</th>
                                        </tr>
                                    </thead>
                                    <tbody id="selectedPartsTableBody">
                                        <tr id="emptySelectedRow">
                                            <td colspan="3" class="text-center text-muted py-3">Henüz parça seçilmedi.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Topla Butonu -->
                            <div class="d-grid gap-2 mb-3">
                                <button class="btn btn-success btn-lg fw-bold py-3 fs-6" onclick="calculateTotalCost()">
                                    🧮 Toplam Maliyeti Hesapla
                                </button>
                            </div>

                            <!-- Sonuç Gösterim Alanı (Gizli Başlar) -->
                            <div id="costResultBox" class="p-3 rounded border text-center d-none bg-white">
                                <h6 class="text-uppercase fw-bold mb-1 text-muted">Toplam Maliyet</h6>
                                <div id="totalCostDisplay" class="fs-2 fw-bold mb-2 text-dark">0,00 €</div>
                                <div id="costStatusAlert" class="alert m-0 fw-bold fs-6" role="alert"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ======================================================= -->
        <!-- SEKME 2: PARÇA YÖNETİMİ (EKLE / DÜZENLE / SİL) EKRANI    -->
        <!-- ======================================================= -->
        <div id="tabAdminView" style="display: none !important;">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow border-0" style="background-color: #ffffff;">
                        <div class="card-header bg-dark text-white fw-bold">
                            <span id="formTitle">Yeni Parça Ekle</span>
                        </div>
                        <div class="card-body p-3 p-sm-4">
                            <input type="hidden" id="partDocId">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Parça Numarası (part-number)</label>
                                <input type="text" id="inputPartNumber" class="form-control form-control-lg fs-6"
                                    placeholder="Örn: YDK-1042">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Parça Adı (part-name)</label>
                                <input type="text" id="inputPartName" class="form-control form-control-lg fs-6"
                                    placeholder="Örn: Kapak Contası">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Maliyet (€ - Euro)</label>
                                <input type="number" step="0.01" id="inputPartCost"
                                    class="form-control form-control-lg fs-6" placeholder="Örn: 150.50">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" id="btnSavePart" class="btn btn-primary btn-lg fw-bold fs-6 py-2"
                                    onclick="saveOrUpdatePart()">
                                    Kaydet
                                </button>

                                <button type="button" id="btnDeletePart"
                                    class="btn btn-outline-danger btn-lg fw-bold fs-6 py-2 d-none"
                                    onclick="deletePartFromForm()">
                                    🗑️ Bu Parçayı Sil
                                </button>

                                <button type="button" id="btnCancelEdit"
                                    class="btn btn-outline-secondary btn-lg fs-6 py-2" onclick="resetForm()">
                                    İptal / Temizle
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (Version 10 Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            doc,
            updateDoc,
            deleteDoc,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdcQMeLQJYxC66EmfeIaRrgc8g0PtVfng",
            authDomain: "meditera-app-6302e.firebaseapp.com",
            projectId: "meditera-app-6302e",
            storageBucket: "meditera-app-6302e.appspot.com",
            messagingSenderId: "19674520398",
            appId: "1:19674520398:web:c1f309351eddded46fdc1f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.dbOps = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy };
    </script>

    <script>
        // Global Durum Değişkenleri
        let allParts = []; // Veritabanından çekilen tüm parçalar
        let selectedParts = []; // Kullanıcının seçtiği parçalar
        const ADMIN_PASSWORD = "2318";

        // Collection Referansı
        const getPartsCollection = () => window.dbOps.collection(window.db, "part-costs");

        // SEKME GEÇİŞLERİ (Tab Management)
        function switchSpareTab(tabName) {
            const selectView = document.getElementById("tabSelectView");
            const adminView = document.getElementById("tabAdminView");
            const tabSelectBtn = document.getElementById("tabSelectBtn");
            const tabAdminBtn = document.getElementById("tabAdminBtn");

            if (tabName === 'select') {
                selectView.style.display = "block";
                adminView.style.setProperty("display", "none", "important");

                tabSelectBtn.classList.add("active", "text-dark");
                tabSelectBtn.classList.remove("text-secondary");
                tabAdminBtn.classList.remove("active", "text-dark");
                tabAdminBtn.classList.add("text-secondary");
            } else if (tabName === 'admin') {
                selectView.style.display = "none";
                adminView.style.setProperty("display", "block", "important");

                tabAdminBtn.classList.add("active", "text-dark");
                tabAdminBtn.classList.remove("text-secondary");
                tabSelectBtn.classList.remove("active", "text-dark");
                tabSelectBtn.classList.add("text-secondary");
            }
        }

        // 1. VERİLERİ ÇEK, HIZLI ÖNBELLEKTEN OKU VE PAHALIDAN UCUZA SIRALA
        async function loadParts(forceRefresh = false) {
            const tbody = document.getElementById("partsSelectTableBody");

            // Eğer tarayıcı hafızasında kayıtlı veri varsa ve zorunlu yenileme istenmediyse anında yükle (Işık hızında)
            const cachedData = sessionStorage.getItem("cached_spare_parts");
            if (cachedData && !forceRefresh) {
                allParts = JSON.parse(cachedData);
                allParts.sort((a, b) => b.partCost - a.partCost); // En yüksekten en düşüğe sırala
                renderPartsTable(allParts);
                return;
            }

            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">Veriler yükleniyor...</td></tr>';

            try {
                // Firebase üzerinde sıralı sorgu atıyoruz (part-cost azalan sıralama)
                const q = window.dbOps.query(getPartsCollection(), window.dbOps.orderBy("part-cost", "desc"));
                const querySnapshot = await window.dbOps.getDocs(q);

                allParts = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allParts.push({
                        id: docSnap.id,
                        partNumber: data["part-number"] || '',
                        partName: data["part-name"] || '',
                        partCost: parseFloat(data["part-cost"] || 0)
                    });
                });

                // Garantilemek için Javascript tarafında da yüksek maliyetten düşüğe doğru sıralıyoruz
                allParts.sort((a, b) => b.partCost - a.partCost);

                // Gelecek sayfa açılışları anında gerçekleşsin diye önbelleğe alıyoruz
                sessionStorage.setItem("cached_spare_parts", JSON.stringify(allParts));

                renderPartsTable(allParts);
            } catch (err) {
                console.error("Sıralı sorgu hatası, varsayılan yöntem deneniyor:", err);
                // İndeks tanımı eksikse düz sorgu atıp istemcide sıralayalım
                loadPartsFallback();
            }
        }

        // İndeks hatası durumunda devreye girecek yedek fonksiyon
        async function loadPartsFallback() {
            const tbody = document.getElementById("partsSelectTableBody");
            try {
                const querySnapshot = await window.dbOps.getDocs(getPartsCollection());
                allParts = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allParts.push({
                        id: docSnap.id,
                        partNumber: data["part-number"] || '',
                        partName: data["part-name"] || '',
                        partCost: parseFloat(data["part-cost"] || 0)
                    });
                });

                // En yüksekten en düşüğe sırala
                allParts.sort((a, b) => b.partCost - a.partCost);
                sessionStorage.setItem("cached_spare_parts", JSON.stringify(allParts));
                renderPartsTable(allParts);
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger py-3">Veri yüklenemedi!</td></tr>';
            }
        }

        // 1. PERFORMANSLI TABLO RENDER ETME
        function renderPartsTable(parts) {
            const tbody = document.getElementById("partsSelectTableBody");

            if (parts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">Aramanıza uygun parça bulunamadı.</td></tr>';
                return;
            }

            // HTML dizesini tek seferde dizide birleştirip DOM'a basarak performansı maksimuma çıkarıyoruz
            const rowsHtml = parts.map(item => `
        <tr>
            <td class="fw-bold text-break fs-7 p-1 p-sm-2">${item.partNumber}</td>
            <td class="text-break fs-7 p-1 p-sm-2">${item.partName}</td>
            <td class="text-end p-1 p-sm-2" style="white-space: nowrap;">
                <button class="btn btn-sm btn-success px-2 py-1 fs-7 fw-bold" title="Ekle" onclick="addPartToSelected('${item.id}')">
                    ➕ <span class="d-none d-sm-inline">Ekle</span>
                </button>
                <button class="btn btn-sm btn-outline-warning px-2 py-1 fs-7" title="Düzenle" onclick="requestEditWithPassword('${item.id}')">
                    ✏️
                </button>
            </td>
        </tr>
    `).join('');

            tbody.innerHTML = rowsHtml;
        }

        // 2. YAVAŞLIĞI ÖNLEYEN DEBOUNCE ARAMA MEKANİZMASI
        let searchTimeout = null;

        function onSearchInput() {
            // Kullanıcı yazmaya devam ediyorsa önceki aramayı iptal et
            if (searchTimeout) clearTimeout(searchTimeout);

            // Kullanıcı tuşlamayı bitirdikten 150 ms sonra süzme işlemini çalıştır
            searchTimeout = setTimeout(() => {
                filterPartsTable();
            }, 150);
        }

        function filterPartsTable() {
            const query = document.getElementById("searchPartInput").value.toLowerCase().trim();

            if (!query) {
                renderPartsTable(allParts);
                return;
            }

            // Bellekteki (allParts) veriden hızlıca süzme
            const filtered = allParts.filter(p =>
                p.partNumber.toLowerCase().includes(query) ||
                p.partName.toLowerCase().includes(query)
            );

            renderPartsTable(filtered);
        }
        // 4. SEÇİLEN LİSTEYE EKLE
        function addPartToSelected(id) {
            const part = allParts.find(p => p.id === id);
            if (!part) return;

            selectedParts.push(part);
            renderSelectedPartsTable();

            // Sonuç kutusunu sıfırla (yeniden hesaplama yapılması için)
            document.getElementById("costResultBox").classList.add("d-none");
        }

        // 5. SEÇİLEN LİSTEDEN ÇIKAR
        function removePartFromSelected(index) {
            selectedParts.splice(index, 1);
            renderSelectedPartsTable();
            document.getElementById("costResultBox").classList.add("d-none");
        }

        // SEÇİLEN PARÇALARI RENDER ET VE SAYACI GÜNCELLE
        function renderSelectedPartsTable() {
            const tbody = document.getElementById("selectedPartsTableBody");
            const badge = document.getElementById("selectedBadge");

            if (badge) badge.innerText = selectedParts.length;
            tbody.innerHTML = "";

            if (selectedParts.length === 0) {
                tbody.innerHTML = '<tr id="emptySelectedRow"><td colspan="3" class="text-center text-muted py-3">Henüz parça seçilmedi.</td></tr>';
                return;
            }

            selectedParts.forEach((item, idx) => {
                tbody.innerHTML += `
            <tr>
                <td class="fw-bold">${item.partNumber}</td>
                <td>${item.partName}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger py-1 px-2 fw-bold" onclick="removePartFromSelected(${idx})">✕</button>
                </td>
            </tr>
        `;
            });
        }

        // TOPLAM MALİYETİ HESAPLA (En az 3 parça kontrolü eklendi)
        function calculateTotalCost() {
            // KONTROL: En az 3 adet parça seçilmeli
            if (selectedParts.length < 3) {
                alert("⚠️ Toplam maliyet hesaplanabilmesi için en az 3 adet yedek parça seçilmelidir!");
                return;
            }

            const total = selectedParts.reduce((sum, item) => sum + item.partCost, 0);
            const resultBox = document.getElementById("costResultBox");
            const display = document.getElementById("totalCostDisplay");
            const alertBox = document.getElementById("costStatusAlert");

            display.innerText = total.toFixed(2).replace('.', ',') + " €";

            if (total > 750) {
                alertBox.className = "alert alert-danger m-0 fw-bold";
                alertBox.innerText = "⚠️ Cihaz hurdaya ayrılacak (Maliyet 750 € üzerinde)";
            } else {
                alertBox.className = "alert alert-success m-0 fw-bold";
                alertBox.innerText = "✅ Maliyet yetersiz. Cihaz tamir edilecek";
            }

            resultBox.classList.remove("d-none");

            // Mobilde hesapla butonuna basınca ekranı otomatik sonuç kutusuna kaydırır
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        // ŞİFRESİZ DÜZENLEME İSTEĞİ (Ana girişte doğrulandığı için direkt açılır)
        function requestEditWithPassword(id) {
            const part = allParts.find(p => p.id === id);
            if (!part) return;

            // Form alanlarını seçilen parçanın bilgileriyle doldur
            document.getElementById("partDocId").value = part.id;
            document.getElementById("inputPartNumber").value = part.partNumber;
            document.getElementById("inputPartName").value = part.partName;
            document.getElementById("inputPartCost").value = part.partCost;

            // UI'ı düzenleme moduna al
            document.getElementById("formTitle").innerText = "Parça Düzenle / Sil";
            document.getElementById("btnSavePart").innerText = "Güncelle";
            document.getElementById("btnSavePart").className = "btn btn-warning btn-lg fw-bold fs-6 py-2";
            document.getElementById("btnDeletePart").classList.remove("d-none");

            // Doğrudan Admin sekmesine geç (Şifre sormadan)
            switchSpareTab('admin');
        }

        // 9. KAYDET VEYA GÜNCELLE
        async function saveOrUpdatePart() {
            const docId = document.getElementById("partDocId").value;
            const partNum = document.getElementById("inputPartNumber").value.trim();
            const partName = document.getElementById("inputPartName").value.trim();
            const partCost = parseFloat(document.getElementById("inputPartCost").value) || 0;

            if (!partNum || !partName) {
                alert("Lütfen Parça Numarası ve Parça Adı alanlarını doldurunuz!");
                return;
            }

            const payload = {
                "part-number": partNum,
                "part-name": partName,
                "part-cost": partCost
            };

            try {
                if (docId) {
                    const docRef = window.dbOps.doc(window.db, "part-costs", docId);
                    await window.dbOps.updateDoc(docRef, payload);
                    alert("Parça başarıyla güncellendi.");
                } else {
                    await window.dbOps.addDoc(getPartsCollection(), payload);
                    alert("Yeni parça başarıyla eklendi.");
                }

                resetForm();
                switchSpareTab('select'); // Seçim sekmesine geri dön
                sessionStorage.removeItem("cached_spare_parts"); // Önbelleği sıfırla
                loadParts(true); // Güncel listeyi çek
            } catch (err) {
                console.error("Kayıt hatası:", err);
                alert("İşlem sırasında bir hata oluştu!");
            }
        }

        // 10. DÜZENLEME FORMUNDAN PARÇA SİL
        async function deletePartFromForm() {
            const docId = document.getElementById("partDocId").value;
            if (!docId) return;

            if (!confirm("Bu yedek parçayı silmek istediğinize emin misiniz?")) return;

            try {
                const docRef = window.dbOps.doc(window.db, "part-costs", docId);
                await window.dbOps.deleteDoc(docRef);
                alert("Parça silindi.");

                resetForm();
                switchSpareTab('select');
                sessionStorage.removeItem("cached_spare_parts"); // Önbelleği sıfırla
                loadParts(true); // Güncel listeyi çek
            } catch (err) {
                console.error("Silme hatası:", err);
                alert("Silme işlemi başarısız!");
            }
        }

        // 11. FORMU SIFIRLA
        function resetForm() {
            document.getElementById("partDocId").value = "";
            document.getElementById("inputPartNumber").value = "";
            document.getElementById("inputPartName").value = "";
            document.getElementById("inputPartCost").value = "";

            document.getElementById("formTitle").innerText = "Yeni Parça Ekle";
            document.getElementById("btnSavePart").innerText = "Kaydet";
            document.getElementById("btnSavePart").className = "btn btn-primary fw-bold py-2";
            document.getElementById("btnDeletePart").classList.add("d-none");
        }

        // Sayfa yüklendiğinde başlat
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(loadParts, 500);
        });
        // SEKME GEÇİŞLERİ (Artık Sekmeler Arasında Şifre Sorulmaz)
        function switchSpareTab(tabName) {
            const selectView = document.getElementById("tabSelectView");
            const adminView = document.getElementById("tabAdminView");
            const tabSelectBtn = document.getElementById("tabSelectBtn");
            const tabAdminBtn = document.getElementById("tabAdminBtn");

            if (tabName === 'select') {
                selectView.style.display = "block";
                adminView.style.setProperty("display", "none", "important");

                tabSelectBtn.classList.add("active", "text-dark");
                tabSelectBtn.classList.remove("text-secondary");
                tabAdminBtn.classList.remove("active", "text-dark");
                tabAdminBtn.classList.add("text-secondary");
            } else if (tabName === 'admin') {
                selectView.style.display = "none";
                adminView.style.setProperty("display", "block", "important");

                tabAdminBtn.classList.add("active", "text-dark");
                tabAdminBtn.classList.remove("text-secondary");
                tabSelectBtn.classList.remove("active", "text-dark");
                tabSelectBtn.classList.add("text-secondary");
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
