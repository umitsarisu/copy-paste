        <div id="rvgContent" class="none">

        <script>
            const rvgObj = {
                rv6psi: 0,
                rv10psi: 0,
                rv1: 0,
                rv2: 0,
                rv3: 0,
                rv4: 0,
                rv5: 0
            }

            const rvg = () => {
                let rv6, rv10;
                while (true) {
                    // rv6: 4.5 ile 8.30 arasında (Formül: Math.random() * (ustSinir - altSinir) + altSinir)
                    rv6 = Math.random() * (8.30 - 4.5) + 4.5;
                    // rv10: 8 ile 12.5 arasında
                    rv10 = Math.random() * (12.30 - 8.30) + 8.30;

                    let fark = rv10 - rv6;

                    // Fark kontrolü güncellendi: min 3.5, max 4.0 (İstediğin gibi maks 4 PSI fark)
                    if (fark >= 3.5 && fark <= 5.0) {
                        break; // Şartlar sağlanırsa döngüden çık
                    }
                }

                // Değerleri objeye kaydet
                rvgObj.rv6psi = rv6.toFixed(2).replace('.', ',');
                rvgObj.rv10psi = rv10.toFixed(2).replace('.', ',');
                rvgObj.rv1 = 0; // Görseldeki gibi ilk iki değer sıfır
                rvgObj.rv2 = 0;
                rvgObj.rv3 = Math.floor(Math.random() * (17 - 10) + 10);
                rvgObj.rv4 = Math.floor(Math.random() * (50 - 30) + 30);
                rvgObj.rv5 = Math.floor(Math.random() * (120 - 70) + 70);

                // --- DEĞERLERİ HTML ALANLARINA YAZDIRMA ---
                // Butonların içine değerleri yazdırıyoruz
                $("#rv6psi").text(rvgObj.rv6psi);
                $("#rv10psi").text(rvgObj.rv10psi);

                // PVT paragraflarının içine değerleri yazdırıyoruz
                $("#rv1").text(rvgObj.rv1);
                $("#rv2").text(rvgObj.rv2);
                $("#rv3").text(rvgObj.rv3);
                $("#rv4").text(rvgObj.rv4);
                $("#rv5").text(rvgObj.rv5);
            }

            // "Yenile" butonuna basıldığında rvg fonksiyonunu tetikle
            $(".btn-primary").click(function () {
                rvg();
            });

            // Sayfa ilk açıldığında da sayılar boş kalmasın, otomatik üretilsin:
            $(document).ready(function () {
                rvg();
            });

            $("#rv6psi, #rv10psi").click(function () {
                const textToCopy = $(this).text();
                if (!textToCopy) return;

                // Modern kopyalama yöntemi
                navigator.clipboard.writeText(textToCopy).catch(err => {
                    // Tarayıcı kısıtlaması veya hata durumunda yedek (fallback) yöntem
                    const el = document.createElement('textarea');
                    el.value = textToCopy;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                });
            });
        </script>
