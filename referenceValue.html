<!DOCTYPE html>
<html lang="tr">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1">
    <!-- Bootstrap CSS -->
    <!-- dahili bootstrap -->
    <!-- <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css"> -->
    <!-- bootstrap cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- bootstrap js cdn -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <!-- jquery cdn -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- css dosyası -->
    <link rel="stylesheet" href="style.css">
    <!-- font-awesome -->
    <script src="https://kit.fontawesome.com/4ebb137696.js" crossorigin="anonymous"></script>
    <!-- dahili javascript -->
    <!-- <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script> -->
    <!-- dahili jquery -->
    <!-- <script src="node_modules/jquery/dist/jquery.min.js"></script> -->
    <!-- sayfa bilgileri -->
    <link rel="shortcut icon" href="images/logo1.png">
    <title>Anasayfa</title>
</head>

<body>
    <style>
        header {
            line-height: 30px;
            padding: 16px;
        }

        .rvg-box {
            width: 200px;
            padding: 10px;
            text-align: center;
            background-color: #f5f5f5;
            border: 1px solid gray;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }

        .btn {
            border: 1px solid gray;
            width: 80px;
            line-height: 30px;
            font-size: 18px;
            font-family: Gill Sans, Gill Sans MT, Calibri, Trebuchet MS, sans-serif;
        }

        .shadow1 {
            box-shadow: 0 1px 15px 0 #0000008e;
        }

        .box {
            width: 500px;
            border-radius: 5px;
        }

        p {
            margin: 5px 0;
            line-height: 30px;
            font-size: 18px;
            font-family: Gill Sans, Gill Sans MT, Calibri, Trebuchet MS, sans-serif;
            font-weight: 700;
        }
    </style>
    <div class="vh-100 d-flex justify-content-center" style="padding-left: 10px; align-content: flex-start;">
        <div class="shadow1 align-self-center p-0 box">
            <div class="d-flex flex-column justify-content-around">
                <header class="border-bottom">
                    <h5 class="m-0">Rastgele Değer Üretici</h5>
                </header>
                <div class="d-flex justify-content-around align-items-center p-3 border-bottom">
                    <div class="rvg-box p-3">
                        <div class="m-auto"><button type="button" class="btn btn-outline-dark align-self-center"
                                title="0 PSI değeri" id="rv6psi"></button></div>
                        <div class="m-auto mt-3"><button type="button" class="btn btn-outline-dark align-self-center"
                                title="10 PSI değeri" id="rv10psi"></button>
                        </div>
                    </div>
                    <div class="rvg-box">
                        <h5>PVT</h5>
                        <hr>
                        <p id="rv1"></p>
                        <p id="rv2"></p>
                        <p id="rv3"></p>
                        <p id="rv4"></p>
                        <p id="rv5"></p>
                    </div>
                </div>
                <div class="d-flex justify-content-end p-2 pe-4"><button class="btn btn-primary btn-lg">Yenile</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const rvgObj = {
            rv6psi: 0,
            rv10psi: 0,
            rv1: 0,
            rv2: 0,
            rv3: 0,
            rv4: 0,
            rv5: 0
        }

        const rvg = () => {
            let rv6, rv10;
            while (true) {
                // rv6: 4.5 ile 8.30 arasında (Formül: Math.random() * (ustSinir - altSinir) + altSinir)
                rv6 = Math.random() * (8.30 - 4.5) + 4.5;
                // rv10: 8 ile 12.5 arasında
                rv10 = Math.random() * (12.30 - 8.30) + 8.30;

                let fark = rv10 - rv6;

                // Fark kontrolü güncellendi: min 3.5, max 4.0 (İstediğin gibi maks 4 PSI fark)
                if (fark >= 3.5 && fark <= 5.0) {
                    break; // Şartlar sağlanırsa döngüden çık
                }
            }

            // Değerleri objeye kaydet
            rvgObj.rv6psi = rv6.toFixed(2).replace('.', ',');
            rvgObj.rv10psi = rv10.toFixed(2).replace('.', ',');
            rvgObj.rv1 = 0; // Görseldeki gibi ilk iki değer sıfır
            rvgObj.rv2 = 0;
            rvgObj.rv3 = Math.floor(Math.random() * (17 - 10) + 10);
            rvgObj.rv4 = Math.floor(Math.random() * (50 - 30) + 30);
            rvgObj.rv5 = Math.floor(Math.random() * (120 - 70) + 70);

            // --- DEĞERLERİ HTML ALANLARINA YAZDIRMA ---
            // Butonların içine değerleri yazdırıyoruz
            $("#rv6psi").text(rvgObj.rv6psi);
            $("#rv10psi").text(rvgObj.rv10psi);

            // PVT paragraflarının içine değerleri yazdırıyoruz
            $("#rv1").text(rvgObj.rv1);
            $("#rv2").text(rvgObj.rv2);
            $("#rv3").text(rvgObj.rv3);
            $("#rv4").text(rvgObj.rv4);
            $("#rv5").text(rvgObj.rv5);
        }

        // "Yenile" butonuna basıldığında rvg fonksiyonunu tetikle
        $(".btn-primary").click(function () {
            rvg();
        });

        // Sayfa ilk açıldığında da sayılar boş kalmasın, otomatik üretilsin:
        $(document).ready(function () {
            rvg();
        });

        $("#rv6psi, #rv10psi").click(function () {
            const textToCopy = $(this).text();
            if (!textToCopy) return;

            // Modern kopyalama yöntemi
            navigator.clipboard.writeText(textToCopy).catch(err => {
                // Tarayıcı kısıtlaması veya hata durumunda yedek (fallback) yöntem
                const el = document.createElement('textarea');
                el.value = textToCopy;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            });
        });
    </script>
</body>

</html>
